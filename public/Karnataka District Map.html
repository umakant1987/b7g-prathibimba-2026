<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Karnataka District Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Mukta:wght@400;500;600&family=Noto+Sans+Kannada:wght@500&display=swap">
<style>
/* Layout: a narrow index rail beside one large glowing map; on phones it stacks as heading, map, index.
   One deliberate look (a blueprint on deep blue), so there is no light variant. */
:root {
  color-scheme: dark;
  --ground: #06204f;
  --ground-mid: #0a3580;
  --ground-hi: #0d4aa3;
  --dot: rgba(111, 188, 255, .30);
  --ink: #eaf5ff;
  --ink-dim: #a9cdf2;
  --line: #8fd6ff;
  --land: rgba(47, 134, 238, .14);
  --land-hover: rgba(61, 155, 255, .42);
  --panel: #061738;
  --panel-edge: rgba(143, 214, 255, .45);
  --hot: #ffcf5c;
  --hot-fill: rgba(255, 207, 92, .34);
  --display: 'Chakra Petch', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --body: 'Mukta', 'Segoe UI', system-ui, sans-serif;
  --kannada: 'Noto Sans Kannada', 'Tunga', 'Kannada Sangam MN', 'Nirmala UI', sans-serif;
}
html, body { min-height: 100%; }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.5; color: var(--ink);
  background:
    radial-gradient(circle at 2px 2px, var(--dot) 1.1px, transparent 1.7px) 0 0 / 24px 24px,
    radial-gradient(120% 90% at 62% 36%, var(--ground-hi), var(--ground-mid) 55%, var(--ground)) var(--ground);
  background-attachment: scroll, fixed;
}
.wrap {
  max-width: 1080px; margin-inline: auto; padding-inline: 20px; padding-block: 28px 40px;
  display: grid; gap: 20px 40px; align-items: start;
  grid-template-columns: minmax(250px, 330px) minmax(0, 1fr);
  grid-template-areas: "head map" "index map";
  grid-template-rows: auto 1fr;
}
.head { grid-area: head; display: grid; gap: 10px; }
.eyebrow { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--line); margin: 0; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 5vw, 50px); line-height: 1.02; margin: 0; text-wrap: balance; }
h1 span { display: block; font-family: var(--kannada); font-weight: 500; font-size: .5em; color: var(--ink-dim); margin-top: 8px; letter-spacing: 0; }
.lede { margin: 0; color: var(--ink-dim); max-width: 34ch; }

.stage { grid-area: map; position: relative; width: min(100%, calc((100svh - 56px) * 0.651)); min-width: min(100%, 300px); margin-inline: auto; }
.stage svg { display: block; width: 100%; height: auto; overflow: visible; }
.map path {
  fill: var(--land); stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round;
  cursor: pointer; transition: fill .15s ease;
}
.map path:hover, .map path.is-hover { fill: var(--land-hover); }
.map path.is-active { fill: var(--hot-fill); stroke: var(--hot); stroke-width: 2.6; }

.tip {
  position: absolute; z-index: 2; width: min(310px, calc(100% - 16px));
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(6, 23, 56, .6), 0 14px 40px rgba(2, 10, 30, .65), 0 0 28px rgba(57, 169, 255, .28);
  padding: 14px 16px 16px; display: grid; gap: 8px;
}
.tip h2 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.15; margin: 0; padding-right: 28px; }
.tip .kn { font-family: var(--kannada); font-size: 15px; color: var(--ink-dim); margin: -4px 0 0; }
.tip .known { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--hot); margin: 4px 0 0; }
.tip ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 15px; line-height: 1.4; }
.tip li { padding-left: 14px; position: relative; }
.tip li::before { content: ""; position: absolute; left: 0; top: .58em; width: 5px; height: 5px; background: var(--line); transform: rotate(45deg); }
.tip .close {
  position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 0; border-radius: 4px;
  background: transparent; color: var(--ink-dim); font: 500 20px/1 var(--display); cursor: pointer;
}
.tip .close:hover { color: var(--ink); background: rgba(143, 214, 255, .14); }
.pin { position: absolute; z-index: 1; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 0 4px rgba(255, 207, 92, .25), 0 0 14px var(--hot); pointer-events: none; }

.index { grid-area: index; display: grid; gap: 12px; }
.index h2 { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--line); margin: 6px 0 0; }
.index ul { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 12px; }
.index li { break-inside: avoid; }
.index button {
  width: 100%; text-align: left; font: 500 15px/1.25 var(--body); color: var(--ink);
  background: transparent; border: 0; border-left: 2px solid transparent; padding: 5px 8px; cursor: pointer;
}
.index button:hover, .index button.is-hover { background: rgba(143, 214, 255, .13); border-left-color: var(--line); }
.index button.is-active { color: var(--hot); border-left-color: var(--hot); background: rgba(255, 207, 92, .10); }
.note { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-dim); max-width: 40ch; }
button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

@media (max-width: 760px) {
  .wrap { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "map" "index"; grid-template-rows: auto; padding-inline: 16px; padding-block: 20px 32px; }
  .stage { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .map path { transition: none; } }
</style>

const $ = id => document.getElementById(id);
const stage = $("stage"), tip = $("tip"), pin = $("pin"), group = $("districts"), list = $("index-list");
const buttons = {};
let activeId = null;

[...group.querySelectorAll("path")].forEach(path => {
  const li = document.createElement("li"), b = document.createElement("button");
  b.type = "button"; b.textContent = path.dataset.name; b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", e => { e.stopPropagation(); openTip(path.id, null, true); });
  b.addEventListener("mouseenter", () => path.classList.add("is-hover"));
  b.addEventListener("mouseleave", () => path.classList.remove("is-hover"));
  b.addEventListener("focus", () => path.classList.add("is-hover"));
  b.addEventListener("blur", () => path.classList.remove("is-hover"));
  path.addEventListener("mouseenter", () => b.classList.add("is-hover"));
  path.addEventListener("mouseleave", () => b.classList.remove("is-hover"));
  li.append(b); list.append(li); buttons[path.id] = b;
});

function openTip(id, point, fromList) {
  const path = $(id), info = DISTRICTS[id];
  if (!path || !info) return;
  closeTip();
  activeId = id;
  group.append(path);                       // draw the selected outline above its neighbours
  path.classList.add("is-active");
  buttons[id].classList.add("is-active"); buttons[id].setAttribute("aria-pressed", "true");

  const s = stage.getBoundingClientRect();
  if (!point) { const b = path.getBoundingClientRect(); point = { x: b.left + b.width / 2 - s.left, y: b.top + b.height / 2 - s.top }; }

  $("tip-name").textContent = path.dataset.name;
  $("tip-kn").textContent = info.kn;
  $("tip-known").textContent = info.known;
  $("tip-facts").replaceChildren(...info.facts.map(f => Object.assign(document.createElement("li"), { textContent: f })));

  tip.hidden = false; pin.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 16, edge = 8;
  const left = Math.max(edge, Math.min(point.x - tw / 2, s.width - tw - edge));
  let top = point.y + gap;
  if (top + th > s.height - edge) top = point.y - th - gap;      // flip above the point
  if (top < edge) top = Math.max(edge, Math.min(point.y + gap, s.height - th - edge));
  tip.style.left = left + "px"; tip.style.top = top + "px";
  pin.style.left = point.x + "px"; pin.style.top = point.y + "px";
  if (fromList) tip.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function closeTip() {
  if (!activeId) return;
  $(activeId).classList.remove("is-active");
  buttons[activeId].classList.remove("is-active"); buttons[activeId].setAttribute("aria-pressed", "false");
  tip.hidden = true; pin.hidden = true; activeId = null;
}

group.addEventListener("click", e => {
  const path = e.target.closest("path"); if (!path) return;
  e.stopPropagation();
  if (path.id === activeId) { closeTip(); return; }
  const s = stage.getBoundingClientRect();
  openTip(path.id, { x: e.clientX - s.left, y: e.clientY - s.top }, false);
});
tip.addEventListener("click", e => e.stopPropagation());
$("tip-close").addEventListener("click", closeTip);
document.addEventListener("click", closeTip);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTip(); });
window.addEventListener("resize", closeTip);
</script>
